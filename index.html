<body>
  <header class="bar">
    <h1 class="who">CASPER KLOOTWIJK <span>System Support Engineer</span></h1>
    <nav class="links" aria-label="Quick links">
      <a href="classic.html">Classic site</a>
      <a href="assets/CV_Casper_Klootwijk_NL.pdf" target="_blank" rel="noopener">CV</a>
      <a href="red-battle/">Battle RED</a>
      <button id="mute" type="button" aria-pressed="true">SOUND ON</button>
    </nav>
  </header>

  <main class="stage">
    <canvas id="screen" width="320" height="144" role="img"
      aria-label="Goldenrod City from Pokémon Crystal. Walk with the arrow keys or click where to go, hold Space to run, press Z or Enter to talk and open doors."></canvas>
    <p class="loading" aria-hidden="true">Loading Goldenrod City…</p>
    <p class="failed-msg">The town could not load. <a href="classic.html">Open the classic portfolio</a>.</p>
    <p id="status" class="sr-only" aria-live="polite"></p>

    <div class="pad" aria-hidden="true">
      <div class="dpad">
        <button data-btn="up" class="up">▲</button>
        <button data-btn="left" class="left">◀</button>
        <button data-btn="right" class="right">▶</button>
        <button data-btn="down" class="down">▼</button>
      </div>
      <div class="ab">
        <button data-btn="B" class="b">B</button>
        <button data-btn="A" class="a">A</button>
      </div>
    </div>
    <p class="help">Arrows / WASD or click walk · hold Space run · Z / Enter talk · X / Esc back · M sound</p>
  </main>

  <noscript>
    <section class="noscript">
      <h2>Casper Klootwijk — System Support Engineer</h2>
      <p>Utrecht, Netherlands. Networking, identity &amp; access, workplace IT. This portfolio is a walkable Goldenrod City and needs JavaScript.</p>
      <p><a href="classic.html">Open the classic portfolio</a> · <a href="mailto:klootwijkc@gmail.com">klootwijkc@gmail.com</a> · <a href="https://github.com/FaiGiJoon">GitHub</a></p>
    </section>
  </noscript>
