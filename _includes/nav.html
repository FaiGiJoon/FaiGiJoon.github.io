{% assign base = site.baseurl %}
<header class="site-header glass fixed top-0 left-0 right-0 z-50" id="navbar">
    <nav class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8" aria-label="Main">
        <div class="flex items-center justify-between h-16">
            <a href="{{ base }}/" class="flex items-center gap-3 font-semibold text-ink whitespace-nowrap">
                <span class="logo-mark" aria-hidden="true">CK</span>
                Casper
            </a>

            <div class="hidden lg:flex items-center gap-6">
                <a href="{{ base }}/#about" class="nav-link text-sm font-medium">About</a>
                <a href="{{ base }}/#experience" class="nav-link text-sm font-medium">Experience</a>
                <a href="{{ base }}/#skills" class="nav-link text-sm font-medium">Skills</a>
                <a href="{{ base }}/#projects" class="nav-link text-sm font-medium">Projects</a>
                <a href="{{ base }}/blog.html" class="nav-link text-sm font-medium"{% if include.active == "blog" %} aria-current="page"{% endif %}>Blog</a>
                <a href="{{ base }}/red-battle/" class="nav-link text-sm font-medium inline-flex items-center gap-1.5"><i data-lucide="gamepad-2" class="w-4 h-4" aria-hidden="true"></i>Battle Red</a>
                <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch between light and dark theme">
                        <i data-lucide="sun" class="icon-sun w-5 h-5" aria-hidden="true"></i>
                        <i data-lucide="moon" class="icon-moon w-5 h-5" aria-hidden="true"></i>
                    </button>
                <a href="{{ base }}/#contact" class="btn btn-primary !min-h-0 !py-2 !px-4 text-sm">Get in touch</a>
            </div>

            <div class="flex items-center gap-1 lg:hidden">
                <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch between light and dark theme">
                        <i data-lucide="sun" class="icon-sun w-5 h-5" aria-hidden="true"></i>
                        <i data-lucide="moon" class="icon-moon w-5 h-5" aria-hidden="true"></i>
                    </button>
                <button id="mobile-menu-btn" type="button" class="lg:hidden w-11 h-11 flex items-center justify-center rounded-lg hover:bg-ink/5 transition-colors" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
                <i data-lucide="menu" class="w-6 h-6" aria-hidden="true"></i>
            </button>
            </div>
        </div>
    </nav>

    <div id="mobile-menu" class="hidden lg:hidden border-t border-line">
        <div class="px-4 py-3 flex flex-col">
            <a href="{{ base }}/#about" class="py-3 text-sm font-medium text-ink">About</a>
            <a href="{{ base }}/#experience" class="py-3 text-sm font-medium text-ink">Experience</a>
            <a href="{{ base }}/#skills" class="py-3 text-sm font-medium text-ink">Skills</a>
            <a href="{{ base }}/#projects" class="py-3 text-sm font-medium text-ink">Projects</a>
            <a href="{{ base }}/blog.html" class="py-3 text-sm font-medium text-ink">Blog</a>
            <a href="{{ base }}/red-battle/" class="py-3 text-sm font-medium text-ink">Battle Red</a>
            <a href="{{ base }}/#contact" class="py-3 text-sm font-semibold text-brand">Get in touch</a>
        </div>
    </div>
</header>
