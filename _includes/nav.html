{% assign base = site.baseurl %}
<header class="fixed top-0 w-full z-50 glass transition-shadow duration-300" id="navbar">
    <nav class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8" aria-label="Main">
        <div class="flex items-center justify-between h-16">
            <a href="{{ base }}/" class="flex items-center gap-3 font-semibold text-gray-100">
                <span class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-sm font-bold text-white" aria-hidden="true">CK</span>
                Casper Klootwijk
            </a>

            <div class="hidden md:flex items-center gap-8">
                <a href="{{ base }}/#about" class="nav-link text-sm font-medium">About</a>
                <a href="{{ base }}/#experience" class="nav-link text-sm font-medium">Experience</a>
                <a href="{{ base }}/#skills" class="nav-link text-sm font-medium">Skills</a>
                <a href="{{ base }}/#projects" class="nav-link text-sm font-medium">Projects</a>
                <a href="{{ base }}/blog.html" class="nav-link text-sm font-medium"{% if include.active == "blog" %} aria-current="page"{% endif %}>Blog</a>
                <a href="{{ base }}/red-battle/" class="nav-link text-sm font-medium inline-flex items-center gap-1.5"><i data-lucide="gamepad-2" class="w-4 h-4" aria-hidden="true"></i>Battle Red</a>
                <a href="{{ base }}/#contact" class="btn btn-primary !min-h-0 !py-2 !px-4 text-sm">Get in touch</a>
            </div>

            <button id="mobile-menu-btn" type="button" class="md:hidden w-11 h-11 flex items-center justify-center rounded-lg hover:bg-white/10 transition-colors" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
                <i data-lucide="menu" class="w-6 h-6" aria-hidden="true"></i>
            </button>
        </div>
    </nav>

    <div id="mobile-menu" class="hidden md:hidden border-t border-white/10">
        <div class="px-4 py-3 flex flex-col">
            <a href="{{ base }}/#about" class="py-3 text-sm font-medium text-gray-200">About</a>
            <a href="{{ base }}/#experience" class="py-3 text-sm font-medium text-gray-200">Experience</a>
            <a href="{{ base }}/#skills" class="py-3 text-sm font-medium text-gray-200">Skills</a>
            <a href="{{ base }}/#projects" class="py-3 text-sm font-medium text-gray-200">Projects</a>
            <a href="{{ base }}/blog.html" class="py-3 text-sm font-medium text-gray-200">Blog</a>
            <a href="{{ base }}/red-battle/" class="py-3 text-sm font-medium text-gray-200">Battle Red</a>
            <a href="{{ base }}/#contact" class="py-3 text-sm font-semibold text-primary-light">Get in touch</a>
        </div>
    </div>
</header>
